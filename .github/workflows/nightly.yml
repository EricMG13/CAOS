name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Clean-slate regression
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ""
      GEMINI_API_KEY: ""
      OPENROUTER_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: caos/server/requirements-dev.txt
      - run: pip install -r caos/server/requirements-dev.txt
      - run: python -m ruff check --config ruff.toml caos/server caos/tests --exclude caos/server/caos/methodology/vendor
      - run: python -m pytest caos/tests/test_clean_slate.py -q
      - run: python3 "Modular OS/tools/check_module_consistency.py"
